[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentreplay"
version = "0.1.0"
description = "Deterministic behavioral testing for AI-agent tool execution traces."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12,<3",
    "PyYAML>=6.0,<7",
    "rich>=14,<15",
    "typer>=0.21,<1",
]

[project.scripts]
agentreplay = "agentreplay.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
